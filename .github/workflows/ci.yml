name: Local study and static demo checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=. python -m pytest -q backend/tests
      - run: PYTHONPATH=. python scripts/run_experiment.py --output artifacts/ci
      - run: PYTHONPATH=. python scripts/verify_experiment.py artifacts/ci/*
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation
          path: artifacts/ci
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run lint
      - run: npm run build
